name: diaitika image

# Builds the image deployed at nutri.diaitika.com. Only the fork runs this.
#   push to diaitika → ghcr.io/rostik32/nutritrace:diaitika and :sha-<short>
on:
  push:
    branches: [ diaitika ]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'rostik32/nutritrace'
    # Native arm64 runner (free for public repos): the server is an Ampere A1, no QEMU needed.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: App version
        id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=diaitika
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}-diaitika
          cache-from: type=gha
          cache-to: type=gha,mode=max
