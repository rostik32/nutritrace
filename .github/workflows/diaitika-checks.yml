name: diaitika checks

# Fork-only checks for PRs into the deployed branch (upstream's ci.yml stays
# as it is). en, ru and uk ship together: see AGENTS.md → Localization.
on:
  pull_request:
    branches: [ diaitika ]
  push:
    branches: [ diaitika ]

jobs:
  i18n-required:
    if: github.repository == 'rostik32/nutritrace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: ru and uk complete
        run: node diaitika/i18n-required.cjs
